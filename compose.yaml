# muthur as a Docker Compose project; on a Synology NAS: Container Manager → Project → Create (docs/DEPLOY.md).
# The image is built by GitHub Actions and pulled from Docker Hub. The install's settings come from .env next to
# this file (copy .env.example); everything else is set in muthur's own Settings page.

services:
  muthur:
    image: tomccargo/muthur:${MUTHUR_VERSION:-latest}
    container_name: muthur
    restart: unless-stopped
    # A user without admin rights that owns the config folder and may write the media folder (docs/DEPLOY.md).
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    ports:
      - "${MUTHUR_PORT:-8580}:8580"
    environment:
      TZ: ${TZ:-UTC}
      MUTHUR_DOWNLOADS: /data/${DOWNLOADS_DIR:-downloads/complete}
      MUTHUR_TV: /data/${TV_DIR:-TV}
      MUTHUR_FILM: /data/${FILM_DIR:-Film}
      MUTHUR_QUARANTINE: /data/${QUARANTINE_DIR:-_muthur-quarantine}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      MUTHUR_OWNED_KEY: ${MUTHUR_OWNED_KEY:-}  # read-only key for GET /api/owned; empty = off (docs/DEPLOY.md §7)
    volumes:
      # One mount for downloads, TV and Film, so a move is an instant rename (ARCHITECTURE.md §3).
      - ${MEDIA_SHARE:?Set MEDIA_SHARE in .env}:/data
      - ${CONFIG_DIR:?Set CONFIG_DIR in .env}:/config
    # Guardrails for a small NAS (ARCHITECTURE.md §3).
    mem_limit: ${MEMORY_LIMIT:-256m}
    cpu_shares: 512

  # Synology only. Removes finished Download Station tasks, tells the Inbox when a download is finished, and updates muthur
  # from its Settings page, all without a DSM login (the DSM user may keep two-step verification): root, privileged and the
  # host's PID namespace, so it can run DSM's own synowebapi on the host (src/muthur/relay.py). No network; it reads only
  # config/relay. Remove this service on another machine, or to switch these off.
  relay:
    image: tomccargo/muthur:${MUTHUR_VERSION:-latest}
    container_name: muthur-relay
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: none
    entrypoint: ["/sbin/tini", "--", "python", "-m", "muthur.relay"]
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID}
      PGID: ${PGID}
      DS_USER: ${DS_USER:-}  # the DSM user that owns the tasks; empty: the user PUID belongs to
      MUTHUR_IMAGE: tomccargo/muthur:${MUTHUR_VERSION:-latest}  # the image an update pulls
      MUTHUR_UPDATES: ${MUTHUR_UPDATES:-on}  # off: no updating from Settings
    volumes:
      - ${CONFIG_DIR}/relay:/spool
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /spool/relay.alive) )) -lt 60"]
      interval: 60s
      timeout: 5s
      start_period: 20s
    mem_limit: 64m
    cpu_shares: 256
    # muthur makes config/relay when it starts; DSM's Docker won't create a missing bind-mount folder itself.
    depends_on:
      muthur:
        condition: service_healthy
