# muthur as a Synology Container Manager project.
# The image is built by GitHub Actions (.github/workflows/image.yml) and pulled from Docker Hub;
# the NAS never builds anything. Settings come from .env next to this file (see .env.example).

services:
  muthur:
    image: tomccargo/muthur:latest
    container_name: muthur
    restart: unless-stopped
    # A DSM user without admin rights that owns the config folder (docs/DEPLOY.md).
    user: "${PUID:-1026}:${PGID:-100}"
    ports:
      - "${MUTHUR_PORT:-8580}:8580"
    environment:
      TZ: ${TZ:-Europe/Brussels}
      MUTHUR_DOWNLOADS: /data/torrent-output/complete
      MUTHUR_TV: /data/TV
      MUTHUR_FILM: /data/Film
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
    volumes:
      # One mount for downloads, TV and Film, so later moves are instant renames (ARCHITECTURE.md §3).
      # Read-only while muthur only plans (milestone 2): it cannot change the library even by mistake.
      - ${MEDIA_SHARE:-/volume1/Iedereen}:/data:ro
      - ${CONFIG_DIR:-/volume1/docker/muthur/config}:/config
    # Guardrails for a 4 GB DS918+ (ARCHITECTURE.md §3).
    mem_limit: 256m
    cpu_shares: 512
