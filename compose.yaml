# muthur as a Docker Compose project; on a Synology NAS: Container Manager → Project → Create (docs/DEPLOY.md).
# The image is built by GitHub Actions and pulled from Docker Hub. The install's settings come from .env next to
# this file (copy .env.example); everything else is set in muthur's own Settings page.

services:
  muthur:
    image: tomccargo/muthur:${MUTHUR_VERSION:-latest}
    container_name: muthur
    restart: unless-stopped
    # A user without admin rights that owns the config folder and may write the media folder (docs/DEPLOY.md).
    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"
    ports:
      - "${MUTHUR_PORT:-8580}:8580"
    environment:
      TZ: ${TZ:-UTC}
      MUTHUR_DOWNLOADS: /data/${DOWNLOADS_DIR:-downloads/complete}
      MUTHUR_TV: /data/${TV_DIR:-TV}
      MUTHUR_FILM: /data/${FILM_DIR:-Film}
      MUTHUR_QUARANTINE: /data/${QUARANTINE_DIR:-_muthur-quarantine}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
    volumes:
      # One mount for downloads, TV and Film, so a move is an instant rename (ARCHITECTURE.md §3).
      - ${MEDIA_SHARE:?Set MEDIA_SHARE in .env}:/data
      - ${CONFIG_DIR:?Set CONFIG_DIR in .env}:/config
    # Guardrails for a small NAS (ARCHITECTURE.md §3).
    mem_limit: ${MEMORY_LIMIT:-256m}
    cpu_shares: 512
