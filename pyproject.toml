[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muthur"
dynamic = ["version"]  # from muthur.__version__, the one place it is written
description = "Sorts finished downloads into a Kodi library and writes Kodi NFOs, so Kodi never has to scrape."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "guessit>=3.8",      # LGPL-3.0, used unmodified as a dependency
    "requests>=2.32",    # Apache-2.0
    "rapidfuzz>=3.9",    # MIT
    "fastapi>=0.162",    # MIT
    "uvicorn>=0.54",     # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "playwright>=1.64", "ruff>=0.17"]  # playwright: Apache-2.0, the UI checks; ruff: MIT

[project.scripts]
muthur = "muthur.cli:main"

[tool.setuptools.dynamic]
version = {attr = "muthur.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
# Rules that find bugs, not style: pyflakes, pycodestyle's errors, bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# An HTTPException raised in an except block replaces the cause with a sentence for the reader on purpose.
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
