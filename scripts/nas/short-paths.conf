# muthur's short addresses on the NAS (docs/DEPLOY.md): nostromo/kodi and nostromo/player open the player,
# nostromo/muthur the dashboard. DSM's own web server includes conf.d/alias.*.conf in its default server on ports
# 80 and 443, as it does for Download Station's /download. A redirect, not a proxy: muthur stays on its own port.
location = /kodi    { return 302 http://$host:8580/; }
location = /kodi/   { return 302 http://$host:8580/; }
location = /player  { return 302 http://$host:8580/; }
location = /player/ { return 302 http://$host:8580/; }
location = /muthur  { return 302 http://$host:8580/dashboard; }
location = /muthur/ { return 302 http://$host:8580/dashboard; }
